events {}

http {

    resolver 127.0.0.11 valid=30s;

    # Map hostnames to upstreams. One file per stack in routes.d/ - to add an
    # app, drop in a `<name>.map` with `host http://container:port;` lines.
    map $host $upstream {
        include /etc/nginx/confs/routes.d/*.map;
        default "";
    }

    # Hosts that may be embedded in an iframe, and who may embed them: add
    # `host "frame-ancestors 'self' https://parent";` lines in routes.d/<name>.frame.
    # An empty value makes add_header skip the header.
    map $host $frame_ancestors {
        include /etc/nginx/confs/routes.d/*.frame;
        default "";
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # Single HTTPS -> HTTP server block for all domains
    server {
        listen 443 ssl;
        server_name default_server;

        ssl_certificate     /etc/nginx/certs/docker-nginx.crt;
        ssl_certificate_key /etc/nginx/certs/docker-nginx.key;

        root /usr/share/nginx/html;

        add_header Content-Security-Policy $frame_ancestors always;

        # Default location
        location / {

            if ($upstream = "") {
                return 404;
            }

            # Otherwise proxy to the upstream
            proxy_pass $upstream;
            # oauth2-proxy session cookies (OIDC tokens) exceed the 4k/8k default
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal location for domainNotFound.html
        error_page 404 @domainNotFound;

        location @domainNotFound {
            internal;
            root /usr/share/nginx/html;
            try_files /domainNotFound.html =404;
        }
    }
}
